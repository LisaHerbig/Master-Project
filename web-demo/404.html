<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden</title>
  <script>
    // GitHub Pages serves this file for every unknown path. The web demo is a single-page
    // app, so reloading e.g. /demo/app/book/1 lands here: hand the path back to the app,
    // which restores it before it starts. Every other path shows the plain 404 below.
    (function () {
      var appBase = '__APP_BASE__';
      var path = location.pathname;
      if (path.indexOf(appBase + '/') === 0) {
        location.replace(appBase + '/?p=' + encodeURIComponent(path.slice(appBase.length) + location.search));
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F6F6FF;
      color: #01013A;
      font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <p>Diese Seite gibt es nicht.</p>
</body>
</html>
